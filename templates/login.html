<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EyeCare AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4f8;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0001;
        }
        h1 { color: #17436b; text-align: center; }
        label { display: block; margin-top: 16px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccd5dd;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #078996;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .message { color: #b42318; text-align: center; }
        p { text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome Back</h1>
        <p>Log in to EyeCare AI</p>

        {% if error %}
            <p class="message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>

            <button type="submit">Log In</button>
        </form>

        <p>New user? <a href="/register">Create an account</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
